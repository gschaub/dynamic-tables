name: Build & Deploy to WordPress.org

on:
  # Auto: when your other workflow creates/pushes a release tag
  push:
    tags:
      - 'v*'             # e.g. v1.3.0

  # Manual: rebuild or redeploy from a chosen ref
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch or tag). Leave blank to use default checkout of the workflow run.'
        required: false
        default: ''
      version:
        description: 'Version to deploy (e.g., 1.3.0). If blank, inferred from tag name when triggered by tag; required if manually deploying to SVN.'
        required: false
        default: ''
      deploy_to_svn:
        description: 'Deploy to wp.org SVN after build?'
        type: boolean
        required: true
        default: false
      assets_override_repo:
        description: 'Optional override for assets repo (owner/repo). Takes precedence over repo variable.'
        required: false
        default: ''
      assets_override_branch:
        description: 'Optional override for assets branch in THIS repo. Takes precedence over repo variable.'
        required: false
        default: ''
      assets_subdir:
        description: 'Optional subdirectory inside the assets source repo/branch (e.g. .wordpress-org).'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Defaults / fallbacks
      PLUGIN_SLUG: dynamic-tables
      # Variables (set in repo settings → Variables) used if inputs not provided:
      VAR_ASSETS_REPO: ${{ vars.WPORG_ASSETS_REPO }}
      VAR_ASSETS_BRANCH: ${{ vars.WPORG_ASSETS_BRANCH }}
      VAR_ASSETS_SUBDIR: ${{ vars.WPORG_ASSETS_SUBDIR }}

    steps:
      - name: Select ref for checkout
        id: pickref
        run: |
          # Prefer dispatch input ref; otherwise for tag push use GITHUB_REF; else use default branch.
          REF_INPUT="${{ github.event.inputs.ref }}"
          if [ -n "$REF_INPUT" ]; then
            echo "ref_to_checkout=$REF_INPUT" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              echo "ref_to_checkout=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref_to_checkout=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pickref.outputs.ref_to_checkout }}

      # ---------- Build (Node/Composer) ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build (npm)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json; skipping npm build."
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install prod deps (Composer, optional)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --no-progress
          else
            echo "No composer.json; skipping composer install."
          fi

      # ---------- Harvest assets from external source ----------
      # Precedence:
      # 1) workflow_dispatch override: assets_override_repo (separate repo)
      # 2) workflow_dispatch override: assets_override_branch (branch in this repo)
      # 3) repo variable: WPORG_ASSETS_REPO (separate repo)
      # 4) repo variable: WPORG_ASSETS_BRANCH (branch in this repo)
      # If none present, we continue without assets (allowed for manual "build-only")
      - name: Resolve assets source
        id: assets_src
        run: |
          # Choose subdir
          SUBDIR_INPUT="${{ github.event.inputs.assets_subdir }}"
          if [ -n "$SUBDIR_INPUT" ]; then
            echo "assets_subdir=$SUBDIR_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ env.VAR_ASSETS_SUBDIR }}" ]; then
            echo "assets_subdir=${{ env.VAR_ASSETS_SUBDIR }}" >> "$GITHUB_OUTPUT"
          else
            echo "assets_subdir=" >> "$GITHUB_OUTPUT"
          fi

          # Choose between repo vs branch
          if [ -n "${{ github.event.inputs.assets_override_repo }}" ]; then
            echo "mode=repo" >> "$GITHUB_OUTPUT"
            echo "repo=${{ github.event.inputs.assets_override_repo }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.assets_override_branch }}" ]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.inputs.assets_override_branch }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ env.VAR_ASSETS_REPO }}" ]; then
            echo "mode=repo" >> "$GITHUB_OUTPUT"
            echo "repo=${{ env.VAR_ASSETS_REPO }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ env.VAR_ASSETS_BRANCH }}" ]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "branch=${{ env.VAR_ASSETS_BRANCH }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout assets (separate repo)
        if: steps.assets_src.outputs.mode == 'repo'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.assets_src.outputs.repo }}
          path: _assets_repo

      - name: Checkout assets (branch in this repo)
        if: steps.assets_src.outputs.mode == 'branch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.assets_src.outputs.branch }}
          path: _assets_branch

      - name: Stage assets into workspace
        run: |
          mkdir -p .wordpress-org
          SRC_SUBDIR="${{ steps.assets_src.outputs.assets_subdir }}"
          if [ "${{ steps.assets_src.outputs.mode }}" = "repo" ]; then
            SRC_DIR="_assets_repo"
          elif [ "${{ steps.assets_src.outputs.mode }}" = "branch" ]; then
            SRC_DIR="_assets_branch"
          else
            SRC_DIR=""
          fi

          if [ -n "$SRC_DIR" ]; then
            if [ -n "$SRC_SUBDIR" ]; then
              SRC_PATH="$SRC_DIR/$SRC_SUBDIR"
            else
              SRC_PATH="$SRC_DIR"
            fi

            if [ -d "$SRC_PATH" ]; then
              echo "Copying assets from $SRC_PATH → .wordpress-org/"
              cp -R "$SRC_PATH"/. .wordpress-org/
              ls -la .wordpress-org || true
            else
              echo "::warning::Assets source path not found ($SRC_PATH). Continuing without assets."
            fi
          else
            echo "::notice::No assets source configured. Continuing without assets."
          fi

      # ---------- Produce a zip identical to what would be deployed ----------
      - name: Build plugin zip (dist)
        uses: 10up/actions-wordpress/plugin/build-zip@stable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: ./*.zip

      # ---------- Determine version ----------
      - name: Infer version
        id: ver
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            echo "version=$INPUT_VER" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              # strip leading "v" if present
              TAG="${{ github.ref_name }}"
              CLEAN="${TAG#v}"
              echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No version provided and not running from a tag. If deploying to SVN, you must supply inputs.version."
              echo "version=" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ---------- Deploy to WordPress.org SVN (conditional) ----------
      - name: Deploy to WordPress.org
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_svn == 'true')
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          SOURCE_DIR: .
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.ver.outputs.version }}
