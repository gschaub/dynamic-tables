name: Build & Deploy to WordPress.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (release version) to build and deploy, e.g. v1.3.0'
        required: true
        default: 'v1.'
      deploy_to_svn:
        description: 'Deploy to WordPress.org SVN after build?'
        type: boolean
        required: true
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PLUGIN_SLUG: dynamic-table-blocks
      ASSETS_DIR: assets-wordpress-repository

    steps:
      # ---------- Checkout plugin code from selected tag ----------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      # ---------- Checkout assets from main branch ----------
      - name: Checkout assets from main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: _assets

      # ---------- Derive version number from tag ----------
      - name: Extract version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          CLEAN="${TAG#v}"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Detected version: $CLEAN"

      # ---------- Build plugin ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS/CSS (if applicable)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json found; skipping JS build."
          fi

      - name: Set up PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (no dev)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --no-progress
          else
            echo "No composer.json; skipping composer install."
          fi

      - name: Remove source maps from build output
        run: |
          set -euo pipefail
          for d in build assets; do
            if [ -d "$d" ]; then
              find "$d" -type f -name '*.map' -delete
            fi
          done

      # ---------- Build clean source tree that is safe for trunk/tags ----------
      - name: Stage deployment source (runtime allowlist)
        run: |
          set -euo pipefail
          rm -rf .wporg-source
          mkdir -p .wporg-source

          rsync -av \
            --include "/*.php" \
            --include "/readme.txt" \
            --include "/license/***" \
            --include "/languages/***" \
            --include "/includes/***" \
            --include "/templates/***" \
            --include "/build/***" \
            --include "/assets/***" \
            --include "/vendor/***" \
            --exclude "*" \
            ./ .wporg-source/

          if [ ! -f ".wporg-source/${PLUGIN_SLUG}.php" ]; then
            echo "::error::Expected main plugin file .wporg-source/${PLUGIN_SLUG}.php not found."
            echo "Staged files:"
            find .wporg-source -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Staged source tree:"
          find .wporg-source -maxdepth 2 -type f | sort

      # ---------- Stage WordPress.org plugin page assets ----------
      - name: Stage WordPress.org assets
        run: |
          set -euo pipefail
          SRC="_assets/${ASSETS_DIR}"

          if [ ! -d "$SRC" ]; then
            echo "::error::Assets directory not found in main/${ASSETS_DIR}/"
            exit 1
          fi

          rm -rf .wordpress-org
          mkdir -p .wordpress-org

          # Copy only official WordPress.org plugin page asset filenames.
          rsync -av \
            --include "banner-*" \
            --include "icon*" \
            --include "screenshot-*" \
            --exclude "*" \
            "$SRC/" .wordpress-org/

          if [ -z "$(find .wordpress-org -maxdepth 1 -type f -print -quit)" ]; then
            echo "::warning::No WordPress.org asset files were staged."
          fi

          echo "Staged WordPress.org assets:"
          find .wordpress-org -maxdepth 1 -type f -printf '%f\n' | sort || true

          rm -rf _assets

      #--- Clear temp archive dir used by deploy action (prevents mkdir collision) ---
      - name: Clear 10up temp archive dir
        run: rm -rf /home/runner/archivetmp || true

      # --- Optional: isolate temp dir for this run (adds safety for parallel jobs) ---
      - name: Set unique TMPDIR
        run: echo "TMPDIR=${RUNNER_TEMP}/wporg_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Validate SVN credentials are configured
        if: ${{ github.event.inputs.deploy_to_svn == 'true' }}
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SVN_USERNAME:-}" ]; then
            echo "::error::SVN username is empty. Set secret WPORG_SVN_USERNAME."
            exit 1
          fi
          if [ -z "${SVN_PASSWORD:-}" ]; then
            echo "::error::SVN password is empty. Set secret WPORG_SVN_PASSWORD."
            exit 1
          fi

      # ---------- Canonical dry-run (exact deploy process) ----------
      - name: Dry-run WordPress.org deploy and generate exact trunk ZIP
        id: deploy_dry_run
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: true
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          BUILD_DIR: .wporg-source
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build deploy manifest from dry-run output
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.deploy_dry_run.outputs['zip-path'] }}"

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Dry-run ZIP not found."
            exit 1
          fi

          unzip -l "$ZIP_PATH" > manifest.txt
          unzip -Z1 "$ZIP_PATH" | sed 's#^#trunk/#' | sort > trunk-targets.txt
          find .wordpress-org -maxdepth 1 -type f -printf 'assets/%f\n' | sort > asset-targets.txt
          cat trunk-targets.txt asset-targets.txt | sort > deploy-targets.txt

          echo "---- Deploy summary ----"
          echo "Trunk entries: $(wc -l < trunk-targets.txt)"
          echo "Asset entries: $(wc -l < asset-targets.txt)"
          echo "Combined entries: $(wc -l < deploy-targets.txt)"
          echo "Dry-run ZIP: $ZIP_PATH"
          echo ""
          echo "First 120 target paths:"
          head -n 120 deploy-targets.txt || true
          echo "------------------------"

      - name: Upload deploy dry-run ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ steps.ver.outputs.version }}-dry-run
          path: ${{ steps.deploy_dry_run.outputs['zip-path'] }}

      - name: Upload deploy manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest
          path: |
            manifest.txt
            trunk-targets.txt
            asset-targets.txt
            deploy-targets.txt

      #--- Clear temp archive dir used by deploy action (prevents mkdir collision) ---
      - name: Clear 10up temp archive dir (before live deploy)
        if: ${{ github.event.inputs.deploy_to_svn == 'true' }}
        run: rm -rf /home/runner/archivetmp || true

      # ---------- Deploy to WordPress.org SVN ----------
      - name: Deploy to WordPress.org SVN
        if: ${{ github.event.inputs.deploy_to_svn == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          BUILD_DIR: .wporg-source
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.ver.outputs.version }}
