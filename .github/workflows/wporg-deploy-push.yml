name: Build & Deploy to WordPress.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (release version) to build and deploy, e.g. v1.3.0'
        required: true
        default: 'v1.'
      deploy_to_svn:
        description: 'Deploy to WordPress.org SVN after build?'
        type: boolean
        required: true
        default: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PLUGIN_SLUG: dynamic-table-blocks
      ASSETS_DIR: assets-wordpress-repository
      SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}

    steps:
      # ---------- Checkout plugin code from selected tag ----------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      # ---------- Checkout assets from main branch ----------
      - name: Checkout assets from main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: _assets

      - name: Stage WordPress.org assets
        run: |
          mkdir -p .wordpress-org
          if [ -d "_assets/${ASSETS_DIR}" ]; then
            cp -R "_assets/${ASSETS_DIR}/." .wordpress-org/
            echo "✅ Copied assets from main/${ASSETS_DIR}/ → .wordpress-org/"
            ls -la .wordpress-org
          else
            echo "::error::Assets directory not found in main/${ASSETS_DIR}/"
            exit 1
          fi

      # ---------- Build plugin ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS/CSS (if applicable)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No package.json found; skipping JS build."
          fi

      - name: Set up PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (no dev)
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-interaction --no-progress
          else
            echo "No composer.json; skipping composer install."
          fi

      # ---------- Produce a zip identical to what would be deployed ----------
      - name: Build plugin zip
        uses: 10up/action-wordpress-plugin-build-zip@stable

      # ---------- Derive version number from tag ----------
      - name: Extract version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          CLEAN="${TAG#v}"
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Detected version: $CLEAN"

      # ---------- Rename ZIP with version ----------
      - name: Rename plugin ZIP with version
        run: |
          set -e
          COUNT=$(ls -1 ./*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No ZIP produced. Check earlier build logs and .distignore."
            ls -la
            exit 1
          fi
          ZIP_FILE=$(ls -1 ./*.zip | head -n 1)
          NEW_NAME="${{ env.PLUGIN_SLUG }}-${{ steps.ver.outputs.version }}.zip"
          mv "$ZIP_FILE" "$NEW_NAME"
          echo "ZIP_PATH=$NEW_NAME" >> "$GITHUB_ENV"
          echo "Renamed ZIP to: $NEW_NAME"

      - name: Upload versioned ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ steps.ver.outputs.version }}.zip
          path: ${{ env.ZIP_PATH }}

      # ---------- DRY-RUN SUMMARY: list files that will be deployed ----------
      - name: Show deploy manifest (dry-run)
        run: |
          set -e
          if [ -z "${ZIP_PATH:-}" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::warning::ZIP not found for manifest step. Skipping manifest generation."
            exit 0
          fi
          echo "Generating deployment manifest from: $ZIP_PATH"
          unzip -l "$ZIP_PATH" > manifest.txt
          echo ""
          echo "---- Manifest summary ----"
          TOTAL_FILES=$(tail -n 2 manifest.txt | head -n 1 | awk '{print $2}')
          TOTAL_SIZE=$(tail -n 1 manifest.txt | awk '{print $1}')
          echo "Files: $TOTAL_FILES"
          echo "Total (bytes in zip listing): $TOTAL_SIZE"
          echo ""
          echo "First 100 entries:"
          unzip -Z1 "$ZIP_PATH" | head -n 100 || true
          echo "---------------------------"
          echo "Full manifest saved as artifact: manifest.txt"

      - name: Upload manifest artifact
        if: ${{ env.ZIP_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest
          path: manifest.txt

      # ---------- Deploy to WordPress.org SVN ----------
      - name: Deploy to WordPress.org SVN
        if: ${{ github.event.inputs.deploy_to_svn == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ env.SVN_USERNAME }}
          SVN_PASSWORD: ${{ env.SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          SOURCE_DIR: .
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.ver.outputs.version }}
